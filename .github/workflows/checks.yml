# Checks on every push and pull request: the build (and that the committed built copies match it), the escapement against the manual, and the
# page in headless Chromium (smoke test, invariants). The slower geometry checks run weekly and on demand (Actions > checks > Run workflow).
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Build (fails if a page loads anything from the network)
        run: python build.py --site-url https://www.marinechronometermodel.com
      - name: Committed built copies match the sources
        run: git diff --exit-code --stat -- chronometer-working-model.html marine-chronometer.html site marine-chronometer-source/chronometer-working-model/dist marine-chronometer-source/marine-chronometer-essay/marine-chronometer.html
      - name: Escapement against the manual's figures
        run: node marine-chronometer-source/chronometer-working-model/tools/escapement.js
  browser:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: marine-chronometer-source/chronometer-working-model/tools}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Smoke test (every control; no console errors or warnings)
        run: python smoke.py
      - name: Invariants (hands, wind indicator, fusee, balance)
        run: python invariants.py
      - name: Solids (every part a closed solid, facing out)
        run: python solids.py
      - name: Exploded view (no two parts meet at any spread)
        run: python exploded.py
  geometry:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run: {working-directory: marine-chronometer-source/chronometer-working-model/tools}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright numpy scipy pillow && python -m playwright install --with-deps chromium
      - name: Fine interference check (0.05 mm)
        run: python fine.py
      - name: Maintaining work over run and wind cycles
        run: python maintaining.py
