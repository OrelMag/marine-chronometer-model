# Visual regression, reported rather than failed: every view rendered from the commit a push is based on and from the push (one views.py, the
# same frozen state), the changed pixels per view in the run's summary and the views that changed, the changes in red, as an artifact.
# On main the base is the commit before the push; on a branch, where the branch left main (so a branch's whole change shows on every push).
# Only pushes that touch the model or vendor/ run it (about 6 minutes); Actions > views > Run workflow runs it on demand.
name: views
on:
  push:
    paths: ['marine-chronometer-source/**', 'vendor/**', '.github/workflows/views.yml']
  workflow_dispatch:
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: {working-directory: marine-chronometer-source/chronometer-working-model/tools}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright numpy pillow && python -m playwright install --with-deps chromium
      - name: The commit to compare with, checked out beside this one
        id: base
        env: {BEFORE: '${{ github.event.before }}'}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qx '0*' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then B=$BEFORE; else B=$(git merge-base origin/main HEAD); fi
          echo "sha=$B" >> "$GITHUB_OUTPUT"
          git worktree add "$RUNNER_TEMP/base" "$B"
      - name: Render every view, from the base and from this commit
        if: steps.base.outputs.sha != github.sha
        run: |
          python views.py base --page "$RUNNER_TEMP/base/marine-chronometer-source/chronometer-working-model/index.html"
          python views.py head
      - name: Changed pixels per view
        if: steps.base.outputs.sha != github.sha
        env: {B: '${{ steps.base.outputs.sha }}'}
        run: |
          { echo "### Views: this commit against ${B:0:7}"; echo; echo "Changed pixels per view (each view with and without Moving parts only); an unchanged model gives 0. The views that changed, the changes in red, are in the artifact."; echo; python views.py --diff base head --md; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.base.outputs.sha != github.sha
        with:
          name: views-changed
          path: marine-chronometer-source/chronometer-working-model/tools/r_vd_*.png
          if-no-files-found: ignore
